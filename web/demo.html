<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000011">
<title>小小御剑师 · 仙剑演示</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000011;
               font-family: Consolas, monospace; }
  body.cursor-off { cursor: none; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  /* 顶部贴沿分段进度条：每段 = 一个手势的 10 秒，随时间填充 */
  #demo-progress { position: fixed; top: 0; left: 0; right: 0; height: 5px; z-index: 15;
                   display: flex; gap: 3px; }
  #demo-progress .seg { flex: 1; background: rgba(0,170,255,.10); overflow: hidden; }
  #demo-progress .seg:first-child { border-radius: 0 0 0 3px; }
  #demo-progress .seg:last-child { border-radius: 0 0 3px 0; }
  #demo-progress .seg i { display: block; height: 100%; width: 0;
                          background: linear-gradient(90deg, #00aaff, #00e5ff);
                          box-shadow: 0 0 8px rgba(0,200,255,.75); }

  /* 左下角：仅手势动作名称（当前项高亮），自动轮播 */
  #demo-labels { position: fixed; left: 22px; bottom: 20px; z-index: 10; pointer-events: none;
                 color: rgba(170,210,240,.45); font-size: 14px; line-height: 1.9;
                 letter-spacing: .12em; text-shadow: 0 1px 8px rgba(0,0,0,.9); }
  #demo-labels .g { white-space: nowrap; transition: color .45s; }
  #demo-labels .g.on { color: #00ffff; }

  /* 加载遮罩 */
  .overlay { position: fixed; inset: 0; z-index: 20; display: none;
             align-items: center; justify-content: center; flex-direction: column;
             background: radial-gradient(ellipse at center, rgba(0,0,17,.92), rgba(0,0,8,.98));
             color: #dce6ff; text-align: center; }
  .overlay.on { display: flex; }
  .spinner { width: 8vmin; height: 8vmin; min-width: 46px; border-radius: 50%;
             border: 2px solid rgba(0,170,255,.2); border-top-color: #00aaff;
             animation: spin 1.1s linear infinite; margin-bottom: 1.4em; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- 电影穿越式标题（v10f）：穿梭 → 白闪 → 标题光爆破现 ---- */
  #flash { position: fixed; inset: 0; z-index: 30; background: #eaf6ff; opacity: 0;
           pointer-events: none; transition: opacity .5s ease-out; }
  #flash.on { opacity: .95; transition: none; }
  #title-card { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column;
                align-items: center; justify-content: center; pointer-events: none; opacity: 0; }
  #title-card.show { opacity: 1; }
  #title-card .t-burst { position: absolute; width: 14px; height: 14px; border-radius: 50%;
                background: radial-gradient(circle, rgba(255,255,255,.95), rgba(120,220,255,.5) 38%, transparent 70%);
                transform: scale(0); opacity: 0; }
  #title-card.show .t-burst { animation: tBurst .9s .15s ease-out forwards; }
  @keyframes tBurst { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(180); opacity: 0; } }
  #title-card .t-main { font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif; font-weight: 700;
                font-size: clamp(44px, 8.2vw, 128px); color: #eaf8ff; letter-spacing: .14em;
                text-shadow: 0 0 18px rgba(0,200,255,.9), 0 0 46px rgba(0,150,255,.55), 0 2px 4px rgba(0,0,0,.6);
                transform: scale(1.8); filter: blur(14px); opacity: 0; }
  #title-card.show .t-main { animation: tIn .55s cubic-bezier(.16,.84,.3,1) forwards,
                tShake .32s .6s linear, tOut .5s 3.3s ease-in forwards; }
  @keyframes tIn { to { transform: scale(1); filter: blur(0); opacity: 1; } }
  @keyframes tShake { 0%, 100% { transform: translate(0,0) scale(1); }
                20% { transform: translate(-5px, 2px) scale(1); }
                40% { transform: translate(4px, -3px) scale(1); }
                60% { transform: translate(-3px, -2px) scale(1); }
                80% { transform: translate(3px, 2px) scale(1); } }
  @keyframes tOut { to { opacity: 0; transform: scale(1.06); filter: blur(6px); } }
  #title-card .t-sub { margin-top: 1.4em; font-size: clamp(15px, 2.2vw, 26px);
                color: #9fd4ff; letter-spacing: .5em; opacity: 0;
                text-shadow: 0 0 12px rgba(0,180,255,.6); }
  #title-card.show .t-sub { animation: tSubIn .8s .55s ease-out forwards, tOut .5s 3.3s ease-in forwards; }
  @keyframes tSubIn { to { opacity: .92; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/jsm/",
    "postprocessing": "./vendor/postprocessing/index.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<!-- 电影穿越式标题：白闪 + 标题光爆 -->
<div id="flash"></div>
<div id="title-card">
  <div class="t-burst"></div>
  <div class="t-main">小小御剑师</div>
  <div class="t-sub">我用AI造出999把仙剑，然后……</div>
</div>

<!-- 顶部贴沿分段进度条：每段对应一个手势的演示时间 -->
<div id="demo-progress">
  <div class="seg"><i></i></div>
  <div class="seg"><i></i></div>
  <div class="seg"><i></i></div>
  <div class="seg"><i></i></div>
  <div class="seg"><i></i></div>
</div>

<div id="demo-labels"></div>

<div id="loading" class="overlay on">
  <div class="spinner"></div>
</div>

<script type="module" src="./js/demo.js"></script>
</body>
</html>
