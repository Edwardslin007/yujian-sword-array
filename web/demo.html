<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000011">
<title>隔空御剑 · 自动演示</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000011;
               font-family: Consolas, monospace; }
  body.cursor-off { cursor: none; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  /* 顶部贴沿分段进度条：每段 = 一个手势的 10 秒，随时间填充 */
  #demo-progress { position: fixed; top: 0; left: 0; right: 0; height: 5px; z-index: 15;
                   display: flex; gap: 3px; }
  #demo-progress .seg { flex: 1; background: rgba(0,170,255,.10); overflow: hidden; }
  #demo-progress .seg:first-child { border-radius: 0 0 0 3px; }
  #demo-progress .seg:last-child { border-radius: 0 0 3px 0; }
  #demo-progress .seg i { display: block; height: 100%; width: 0;
                          background: linear-gradient(90deg, #00aaff, #00e5ff);
                          box-shadow: 0 0 8px rgba(0,200,255,.75); }

  /* 左下角：仅手势动作名称（当前项高亮），自动轮播 */
  #demo-labels { position: fixed; left: 22px; bottom: 20px; z-index: 10; pointer-events: none;
                 color: rgba(170,210,240,.45); font-size: 14px; line-height: 1.9;
                 letter-spacing: .12em; text-shadow: 0 1px 8px rgba(0,0,0,.9); }
  #demo-labels .g { white-space: nowrap; transition: color .45s; }
  #demo-labels .g.on { color: #00ffff; }

  /* 加载遮罩 */
  .overlay { position: fixed; inset: 0; z-index: 20; display: none;
             align-items: center; justify-content: center; flex-direction: column;
             background: radial-gradient(ellipse at center, rgba(0,0,17,.92), rgba(0,0,8,.98));
             color: #dce6ff; text-align: center; }
  .overlay.on { display: flex; }
  .spinner { width: 8vmin; height: 8vmin; min-width: 46px; border-radius: 50%;
             border: 2px solid rgba(0,170,255,.2); border-top-color: #00aaff;
             animation: spin 1.1s linear infinite; margin-bottom: 1.4em; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/jsm/",
    "postprocessing": "./vendor/postprocessing/index.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<!-- 顶部贴沿分段进度条：每段对应一个手势的演示时间 -->
<div id="demo-progress">
  <div class="seg"><i></i></div>
  <div class="seg"><i></i></div>
  <div class="seg"><i></i></div>
  <div class="seg"><i></i></div>
  <div class="seg"><i></i></div>
</div>

<div id="demo-labels"></div>

<div id="loading" class="overlay on">
  <div class="spinner"></div>
</div>

<script type="module" src="./js/demo.js"></script>
</body>
</html>
